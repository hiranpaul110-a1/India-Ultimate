<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Ultimate</title>

  <!-- Google Material Symbols (Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Fraunces (display serif, editorial character) + Inter (body) + IBM Plex Mono (data / links) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <!-- PapaParse for robust CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --bg: #0a0c11;
      --bg-header: #0d1017;
      --surface: #131720;
      --surface-hover: #171c27;
      --border: #232a37;
      --border-soft: #1a202c;

      --gold: #c9a25e;
      --gold-bright: #e3c184;
      --gold-dim: #8a7145;
      --brick: #a94e30;

      --text: #f1ecdf;
      --text-dim: #99a1b0;
      --text-faint: #5b6373;

      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg);
    }

    body {
      color: var(--text);
      font-family: var(--font-body);
      padding-bottom: 32px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, input {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* ---------- Sticky Header ---------- */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background:
        radial-gradient(120% 140% at 50% -40%, rgba(201,162,94,0.10), transparent 60%),
        var(--bg-header);
      padding: 18px 16px 10px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    .header-inner,
    .cards-container {
      max-width: 640px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 14px;
    }

    .app-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--gold-bright);
    }

    .app-tagline {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .title-ornament {
      position: relative;
      width: 100%;
      height: 1px;
      margin: 12px 0 14px 0;
      background: linear-gradient(90deg, transparent, var(--gold-dim) 30%, var(--gold-dim) 70%, transparent);
      opacity: 0.7;
    }

    .title-ornament::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 8px rgba(201,162,94,0.6);
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(201,162,94,0.12);
    }

    .search-box input::placeholder {
      color: var(--text-faint);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      font-size: 18px;
      pointer-events: none;
    }

    /* ---------- Category Tabs ---------- */
    .categories-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 10px 8px 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .category-btn:hover {
      color: var(--text);
    }

    .category-btn.active {
      color: var(--gold-bright);
      border-bottom-color: var(--gold);
      font-weight: 600;
    }

    /* ---------- Cards ---------- */
    .cards-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      position: relative;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      align-items: flex-start;
      overflow: hidden;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .card:hover {
      background-color: var(--surface-hover);
      border-color: #2c3546;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card.pinned {
      border-left-color: var(--gold);
      border-color: #2d2717;
      background-color: #171410;
    }

    /* folded-corner ledger marker for pinned entries */
    .card.pinned::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 26px 26px 0;
      border-color: transparent var(--gold) transparent transparent;
      opacity: 0.9;
    }

    .card-logo {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      background-color: var(--border);
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      user-select: none;
    }

    .card.pinned .card-logo {
      box-shadow: 0 0 0 1px rgba(201,162,94,0.35);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      padding-right: 22px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-link {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--gold-dim);
      margin-bottom: 6px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .card-note {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ---------- Pin Action Button ---------- */
    .pin-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .pin-btn:hover {
      color: var(--gold);
      transform: scale(1.08);
    }

    .pin-btn .material-symbols-outlined {
      font-size: 17px;
    }

    .card.pinned .pin-btn {
      color: #1a1408;
      top: 5px;
      right: 4px;
    }

    .card.pinned .pin-btn .material-symbols-outlined {
      font-variation-settings: "FILL" 1;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-faint);
      font-size: 12.5px;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <div class="sticky-header">
    <div class="header-inner">
      <div class="brand">
        <div class="app-title">India Ultimate</div>
        <div class="app-tagline">Curated Web Directory</div>
      </div>
      <div class="title-ornament"></div>
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="searchInput" placeholder="Search the directory…" oninput="filterData()">
      </div>
      <div class="categories-bar" id="categoriesBar">
        <button class="category-btn active" onclick="selectCategory('All', this)">All</button>
      </div>
    </div>
  </div>

  <!-- Cards Container -->
  <div class="cards-container" id="cardsContainer">
    <div class="loading">Loading the directory…</div>
  </div>

  <script>
    const SHEET_ID = "1AkrtUvg2c6OawhJxXbmgViWcmTss5mSeynnCvE_6a8s";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    const DEFAULT_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 24 24' fill='%238b949e'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z'/></svg>";

    let allData = [];
    let currentCategory = "All";
    let pinnedIds = JSON.parse(localStorage.getItem('pinnedWebsites') || '[]');

    function isUrl(str) {
      if (!str) return false;
      str = str.trim();
      return str.startsWith('http://') || str.startsWith('https://') || str.startsWith('data:image');
    }

    function formatImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[\/=]([a-zA-Z0-9_-]{25,})/);
        if (idMatch && idMatch[1]) {
          return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
        }
      }
      return url;
    }

    function handleImgError(img) {
      img.onerror = null;
      img.src = DEFAULT_ICON;
    }

    function togglePin(event, siteName) {
      event.preventDefault();
      event.stopPropagation();

      if (pinnedIds.includes(siteName)) {
        pinnedIds = pinnedIds.filter(id => id !== siteName);
      } else {
        pinnedIds.push(siteName);
      }

      localStorage.setItem('pinnedWebsites', JSON.stringify(pinnedIds));
      filterData();
    }

    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();

        Papa.parse(text, {
          header: true,
          skipEmptyLines: true,
          transformHeader: function(h) {
            return h.trim().toLowerCase();
          },
          complete: function(results) {
            allData = results.data;
            setupCategories();
            filterData();
          }
        });
      } catch (error) {
        document.getElementById('cardsContainer').innerHTML = `<div class="loading">Couldn't reach the directory. Check your connection.</div>`;
      }
    }

    function setupCategories() {
      const categoriesBar = document.getElementById('categoriesBar');
      const rawCategories = allData.map(item => item['category'] ? item['category'].trim() : '').filter(Boolean);
      const categories = ['All', ...new Set(rawCategories)];

      categoriesBar.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === 'All' ? 'active' : ''}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}', this)">${cat}</button>
      `).join('');
    }

    function selectCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      filterData();
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      let filtered = allData.filter(item => {
        const cat = item['category'] ? item['category'].trim() : '';
        const matchesCategory = currentCategory === 'All' || cat === currentCategory;
        const name = (item['web site name'] || '').toLowerCase();
        const note = (item['note'] || '').toLowerCase();
        const matchesSearch = name.includes(query) || note.includes(query);

        return matchesCategory && matchesSearch;
      });

      // Sort pinned items to top
      filtered.sort((a, b) => {
        const aName = a['web site name'] || '';
        const bName = b['web site name'] || '';
        const aPinned = pinnedIds.includes(aName);
        const bPinned = pinnedIds.includes(bName);
        return bPinned - aPinned;
      });

      renderCards(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById('cardsContainer');

      if (data.length === 0) {
        container.innerHTML = `<div class="loading">No matches in the ledger yet.</div>`;
        return;
      }

      container.innerHTML = data.map(item => {
        const name = item['web site name'] || 'Untitled';
        const rawLink = item['web link'] || '#';
        const formattedLink = rawLink.startsWith('http') ? rawLink : `https://${rawLink}`;
        const logoRaw = item['logo url'] || '';
        const isPinned = pinnedIds.includes(name);

        let logoHtml = '';
        if (isUrl(logoRaw)) {
          const imgUrl = formatImageUrl(logoRaw);
          logoHtml = `<img class="card-logo" src="${imgUrl}" alt="Logo" onerror="handleImgError(this)">`;
        } else if (logoRaw.trim() !== '') {
          // If text or Emoji
          logoHtml = `<div class="card-logo">${logoRaw.trim()}</div>`;
        } else {
          // Fallback Default SVG Icon
          logoHtml = `<img class="card-logo" src="${DEFAULT_ICON}" alt="Logo">`;
        }

        return `
          <a href="${formattedLink}" target="_blank" class="card ${isPinned ? 'pinned' : ''}">
            ${logoHtml}
            <div class="card-content">
              <div class="card-title">${name}</div>
              <div class="card-link">${item['web link'] || ''}</div>
              <div class="card-note">${item['note'] ? 'NOTE : ' + item['note'] : ''}</div>
            </div>
            <button class="pin-btn" title="Pin Website" onclick="togglePin(event, '${name.replace(/'/g, "\\'")}')">
              <span class="material-symbols-outlined">push_pin</span>
            </button>
          </a>
        `;
      }).join('');
    }

    fetchData();
  </script>
</body>
</html>
